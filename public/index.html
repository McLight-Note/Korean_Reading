<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울대 Reader</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1><a href="#/">서울대 Reader</a></h1>
  <span class="spacer"></span>
  <label class="langbox" title="Language of the Google Translate results">Translate to <select id="lang"></select></label>
  <span id="auth-box" class="auth" hidden></span>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main>
  <section id="view-list">
    <div class="toolbar">
      <select id="f-level" aria-label="Level"><option value="">All levels</option></select>
      <select id="f-status" aria-label="Read status">
        <option value="">All stories</option><option value="unread">Not read yet</option><option value="read">Read</option>
      </select>
      <span id="progress" class="muted"></span>
    </div>
    <div id="stories-list"><p class="muted">Loading stories…</p></div>
  </section>

  <section id="view-read" hidden>
    <a class="back" href="#/">← All stories</a>
    <div class="readgrid">
      <article>
        <div class="titlerow">
          <h2 id="s-title"></h2>
          <span id="s-level" class="chip"></span>
          <span class="spacer"></span>
          <button id="btn-read"></button>
          <a id="btn-next" class="btnlink" href="#/" hidden>Next unread story →</a>
        </div>
        <div id="text" class="text" lang="ko"></div>
        <div id="end-sentinel"></div>
        <p class="legend"><span class="dot v"></span> word to learn <span class="dot g"></span> grammar to learn <span class="muted">· click any word for its translation</span></p>
        <section id="below"></section>
      </article>
      <aside id="detail" class="detail"><p class="muted">Click any word. Its translation appears here.</p></aside>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="core.js"></script>
<script src="translate.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
